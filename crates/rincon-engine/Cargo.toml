[package]
name        = "rincon-engine"
description = "Session orchestration: a pure state machine plus the driver that executes it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
rincon-core      = { workspace = true }
rincon-audio     = { workspace = true }
rincon-control   = { workspace = true }
rincon-discovery = { workspace = true }
rincon-stream    = { workspace = true }
serde            = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing          = { workspace = true }

[dev-dependencies]
rincon-testkit = { workspace = true }
reqwest        = { workspace = true, default-features = false }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
