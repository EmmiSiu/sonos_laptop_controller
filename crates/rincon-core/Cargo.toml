[package]
name        = "rincon-core"
description = "Domain types, validators, and cross-cutting contracts shared by every Rincon crate."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
# Only for `escape::unescape` in the XML guard: a pure decoder, no I/O, which keeps this
# crate's "no I/O anywhere" rule intact.
quick-xml          = { workspace = true }
serde              = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
url                = { workspace = true }

[dev-dependencies]
proptest   = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true }

[lints]
workspace = true
