# Supply-chain and secret-hygiene gates.
#
# Separate from `ci.yml` so that a new advisory published overnight turns this red without
# anyone having to push a commit — the scheduled run is the point, not an afterthought.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:00 UTC daily. An advisory against a dependency is news whether or not we pushed today.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    # Covers: RQ-SEC-011
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: licences, advisories, sources, bans
        # `deny.toml` refuses copyleft licences outright: a GPL dependency in a shipped desktop
        # binary is a licensing incident, not a warning.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          # No `--all-features` here: `deny.toml` sets `all-features = true` under [graph],
          # and cargo-deny 0.20 rejects the flag on the `check` subcommand.
          arguments: ""

  audit:
    # Covers: RQ-SEC-011
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-deps:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: high-severity advisories fail the build
        run: npm audit --audit-level=high

  no-egress:
    # Covers: RQ-SEC-009
    name: no phone-home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: no telemetry, analytics, or update-check dependency
        # "We do not phone home" is a product promise. A promise that only lives in a README
        # gets broken by a dependency somebody adds for a good reason.
        run: |
          set -euo pipefail
          forbidden='sentry|posthog|mixpanel|segment|amplitude|self_update|self-update|reqwest-middleware-tracing'
          if grep -rniE "^($forbidden)" --include=Cargo.toml . ; then
            echo "::error::a telemetry or auto-update dependency was added"
            exit 1
          fi
          if grep -rniE "\"($forbidden)" apps/desktop/package.json ; then
            echo "::error::a telemetry dependency was added to the frontend"
            exit 1
          fi
          echo "no telemetry dependencies found"
