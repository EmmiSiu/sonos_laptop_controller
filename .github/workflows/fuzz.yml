# Overnight fuzzing of the parsers.
#
# Not on the PR path: a five-minute fuzz run finds nothing a property test did not, and a
# useful one takes longer than anyone will wait for a review. So the cheap version runs on
# every PR (the `arbitrary bytes never panic` properties in each parser) and the thorough
# version runs here.
name: Fuzz

on:
  schedule:
    # 03:00 UTC. Long enough to matter, quiet enough not to compete for runners.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        type: string
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    # Covers: RQ-SEC-004
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_ssdp, parse_description, parse_soap, parse_topology]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # libFuzzer needs the sanitiser runtime, which only nightly ships.
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-${{ matrix.target }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-fuzz

      - name: fuzz
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ inputs.seconds || '300' }} \
            -rss_limit_mb=2048

      - name: keep the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
