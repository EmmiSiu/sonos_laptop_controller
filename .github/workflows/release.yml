# Builds the installers, and only from a tag.
#
# Nothing here can be triggered by a pull request, and nothing produces an artifact from an
# arbitrary branch: a release binary must be traceable to a tagged commit, built by CI, with a
# provenance attestation anyone can verify. See RQ-SEC-012.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the installers without publishing a release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # A tag does not bypass the quality bar. Releasing something that never passed CI is how a
    # project ships a binary nobody can reproduce.
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: node scripts/spec-guard.mjs

  build:
    # Covers: RQ-SEC-012
    name: build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: build the installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent on a fork; the build simply produces an unsigned bundle in that case.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Rincon ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      - name: check the installer is not bloated
        # SPEC-000 G4 promises an installer under 15 MB. A promise with no check is a wish,
        # and bundle size is exactly the kind of thing that creeps up one dependency at a time.
        shell: bash
        run: |
          set -euo pipefail
          root="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          [ -d "$root" ] || { echo "no bundle directory at $root"; exit 1; }
          oversized=0
          while IFS= read -r file; do
            bytes=$(wc -c < "$file")
            mib=$(( bytes / 1048576 ))
            echo "$file: ${mib} MiB"
            if [ "$bytes" -gt $((15 * 1048576)) ]; then
              echo "::error::$file is ${mib} MiB, over the 15 MiB budget in SPEC-000 G4"
              oversized=1
            fi
          done < <(find "$root" -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \))
          exit "$oversized"

      - name: attest provenance
        # Lets anyone verify the artifact came from this workflow, from this commit, rather
        # than from a laptop. `gh attestation verify` checks it.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rincon-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  cli:
    name: headless binary (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rincon.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rincon
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cli-${{ matrix.target }}
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build -p rincon-cli --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rincon-cli-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
