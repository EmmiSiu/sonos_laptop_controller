# cargo-deny: supply-chain gate. Runs in CI on every PR (see .github/workflows/security.yml).

[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Permissive-only. Anything copyleft in a shipped desktop binary is a licensing
# incident, so it fails the build rather than warning.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Unmaintained / superseded crates we never want pulled in transitively.
    { name = "openssl",     reason = "use rustls; no system OpenSSL in the shipped binary" },
    { name = "openssl-sys", reason = "use rustls; no system OpenSSL in the shipped binary" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
